name: Build and push Docker image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (e.g. 1.0, 1.1) — also tagged :latest"
        required: false
        default: "latest"
  # Builds on every main push touching the image, so a broken Dockerfile is
  # caught the day it breaks. It does NOT publish: see `push:` on the build
  # step, which is true only for a deliberate workflow_dispatch. The original
  # note here — "disabled until manually tested end-to-end" — was a decision
  # about publishing an untested image, not about building one.
  #
  # The paths below previously carried a `metis/` prefix retired when the repo
  # root was promoted, so the filter matched nothing and the trigger could
  # never have fired even if it had been enabled.
  push:
    branches:
      - main
    paths:
      - "system/mcp-server/**"
      - "system/app-py/**"
      - "system/install/docker/**"
      - "Dockerfile"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build (publish only on manual dispatch)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine tags
        id: tags
        run: |
          BASE="ghcr.io/${{ github.repository_owner }}/metis"
          INPUT="${{ github.event.inputs.tag }}"
          if [ -n "$INPUT" ] && [ "$INPUT" != "latest" ]; then
            echo "TAGS=$BASE:$INPUT,$BASE:latest" >> "$GITHUB_OUTPUT"
          else
            echo "TAGS=$BASE:latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: system/install/docker/Dockerfile
          push: ${{ github.event_name == 'workflow_dispatch' }}
          tags: ${{ steps.tags.outputs.TAGS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.repository.updated_at }}
