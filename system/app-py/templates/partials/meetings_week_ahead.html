<div class="panel u-mb-4">
  {% if meetings %}
    {% for m in meetings %}
    <div style="padding:14px 18px;{% if not loop.last %}border-bottom:1px solid var(--m-rule-soft);{% endif %}border-left:2px solid transparent;">
      <div class="u-label u-mb-1" style="letter-spacing:0.2em;">{{ m.date[:10] if m.date else '—' }}</div>
      <div style="font-family:var(--m-display);font-size:var(--t-body);color:var(--m-ink);">{{ m.title or 'Meeting' }}</div>
      {% if m.participants %}
      <div class="u-ed" style="font-size:var(--t-meta);margin-top:2px;">{{ m.participants[:50] }}</div>
      {% endif %}
    </div>
    {% endfor %}
  {% else %}
  <div class="empty-row">No meetings scheduled this week.</div>
  {% endif %}
</div>
