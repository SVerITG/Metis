{# System info panel — Archive design system #}
<div style="padding:14px 22px;display:grid;grid-template-columns:120px 1fr;gap:8px 14px;font-family:var(--m-ui);font-size:var(--t-meta);color:var(--m-text);">
  <div class="u-label u-label--wide">RC root</div>
  <div class="u-truncate" style="color:var(--m-ink);" title="{{ rc_root }}">{{ rc_root }}</div>

  <div class="u-label u-label--wide">Database</div>
  <div>
    {% if db_size_kb %}
      <span style="font-family:var(--m-mono);color:var(--m-ink);">{{ db_size_kb }} KB</span>
    {% else %}
      <span style="color:var(--m-alert);">not found</span>
    {% endif %}
  </div>

  <div class="u-label u-label--wide">DB path</div>
  <div class="u-label u-truncate" title="{{ db_path }}">{{ db_path }}</div>
</div>
