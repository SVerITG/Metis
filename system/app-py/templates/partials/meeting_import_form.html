<div id="meeting-import-modal" style="position:fixed;top:0;left:0;right:0;bottom:0;z-index:800;background:rgba(0,0,0,0.3);display:flex;align-items:flex-start;justify-content:center;padding-top:60px;">
  <div class="panel m-drawer-top" style="width:640px;max-width:96vw;padding:0;box-shadow:0 8px 32px rgba(0,0,0,0.18);max-height:88vh;overflow-y:auto;">

    <!-- Header -->
    <div class="u-row u-row--between u-rule" style="padding:var(--m-space-4) var(--m-space-5) var(--m-space-3);position:sticky;top:0;background:var(--m-surface);z-index:1;">
      <div class="kicker kicker--ochre" style="margin:0;">
        <svg viewBox="0 0 16 16" width="11" height="11" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="5.5"/><polyline points="8 4.5 8 8 10.5 9.5"/></svg>
        IMPORT MEETING
      </div>
      <button class="u-label" onclick="closeMeetingImport()" style="background:none;border:none;cursor:pointer;padding:2px 6px;">ESC</button>
    </div>

    <!-- Form -->
    <form hx-post="/api/meeting/import"
          hx-target="#meeting-import-result"
          hx-swap="innerHTML"
          style="padding:var(--m-space-4) var(--m-space-5) var(--m-space-5);">

      <div class="u-mb-3" style="display:grid;grid-template-columns:1fr 140px 100px;gap:var(--m-space-3);">
        <div>
          <label class="u-label u-mb-1" style="display:block;">TITLE</label>
          <input type="text" name="title" required placeholder="Meeting title"
                 style="width:100%;box-sizing:border-box;background:var(--m-surface-2);border:1px solid var(--m-line);border-radius:var(--m-radius);padding:var(--m-space-2) var(--m-space-3);font-family:var(--m-sans);font-size:var(--t-body);color:var(--m-ink);outline:none;">
        </div>
        <div>
          <label class="u-label u-mb-1" style="display:block;">DATE</label>
          <input type="date" name="meeting_date" required
                 value="{{ today }}"
                 style="width:100%;box-sizing:border-box;background:var(--m-surface-2);border:1px solid var(--m-line);border-radius:var(--m-radius);padding:var(--m-space-2) var(--m-space-3);font-family:var(--m-sans);font-size:var(--t-body);color:var(--m-ink);outline:none;">
        </div>
        <div>
          <label class="u-label u-mb-1" style="display:block;">DURATION</label>
          <input type="number" name="duration_minutes" placeholder="min"
                 style="width:100%;box-sizing:border-box;background:var(--m-surface-2);border:1px solid var(--m-line);border-radius:var(--m-radius);padding:var(--m-space-2) var(--m-space-3);font-family:var(--m-sans);font-size:var(--t-body);color:var(--m-ink);outline:none;">
        </div>
      </div>

      <div class="u-mb-3">
        <label class="u-label u-mb-1" style="display:block;">PARTICIPANTS</label>
        <input type="text" name="attendees" placeholder="Name 1, Name 2, …"
               style="width:100%;box-sizing:border-box;background:var(--m-surface-2);border:1px solid var(--m-line);border-radius:var(--m-radius);padding:var(--m-space-2) var(--m-space-3);font-family:var(--m-sans);font-size:var(--t-body);color:var(--m-ink);outline:none;">
      </div>

      <div class="u-mb-3">
        <label class="u-label u-mb-1" style="display:block;">TRANSCRIPT / NOTES</label>
        <textarea name="transcript" rows="10" autofocus
                  placeholder="Paste your meeting transcript or notes here.&#10;&#10;Metis will auto-extract:&#10;Action: Do X  → action items&#10;Decision: We agreed on Y  → decisions&#10;Follow-up: Check Z by Friday  → follow-ups&#10;&#10;Or use section headers:&#10;Actions:&#10;- Fix the report&#10;- Send to supervisor"
                  style="width:100%;box-sizing:border-box;background:var(--m-surface-2);border:1px solid var(--m-line);border-radius:var(--m-radius);padding:var(--m-space-3) var(--m-space-3);font-family:var(--m-sans);font-size:var(--t-small);color:var(--m-ink);resize:vertical;line-height:1.6;outline:none;"></textarea>
      </div>

      <!-- Result area -->
      <div id="meeting-import-result"></div>

      <div style="display:flex;gap:var(--m-space-2);margin-top:var(--m-space-4);">
        <button type="submit" class="btn btn--primary btn--caps u-grow">Save &amp; Analyse</button>
        <button type="button" class="btn btn--ghost btn--caps" onclick="closeMeetingImport()">Cancel</button>
      </div>

    </form>
  </div>
</div>

<script>
function closeMeetingImport() {
  const el = document.getElementById('meeting-import-modal');
  if (el) el.remove();
}
</script>
