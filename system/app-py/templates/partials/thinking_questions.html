<!-- thinking_questions.html — Editorial open-questions list -->
{% if not questions %}
<div class="panel panel-pad" style="text-align:center;padding:var(--m-space-5) var(--m-space-5);border:1px dashed var(--m-line);">
  <p class="ed" style="font-size:var(--t-body);color:var(--m-muted);margin:0 0 var(--m-space-2);">No open questions.</p>
  <p class="ed" style="font-size:var(--t-small);color:var(--m-muted);margin:0;">
    Press <kbd>Ctrl+K</kbd> and prefix with <code>q:</code> to capture a question.
    Good research runs on unresolved questions — write them down when they surface.
  </p>
</div>
{% else %}
<div class="panel">
  {% for q in questions %}
  <div style="display:grid;grid-template-columns:24px 1fr;gap:12px;align-items:start;padding:14px 20px;{% if not loop.last %}border-bottom:1px solid var(--m-rule-soft);{% endif %}">
    <span style="font-family:var(--m-display);font-style:italic;font-size:var(--t-h4);color:var(--m-alert);line-height:1;">?</span>
    <div>
      <div class="u-title" style="line-height:1.5;">{{ q.content }}</div>
      <div class="u-label" style="margin-top:var(--m-space-1);">{{ (q.created_at or '')[:10] }}</div>
    </div>
  </div>
  {% endfor %}
</div>
{% endif %}
