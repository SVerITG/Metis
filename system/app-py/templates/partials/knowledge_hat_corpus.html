<div id="hat-corpus-section">
  <h2 class="sec-label u-mb-3">
    <span>Knowledge Corpus</span>
    <span class="tail">{{ total }} PAPERS · {{ seeded_count }} ANNOTATED · {{ triage_count }} TO TRIAGE</span>
    <button class="u-label u-label--wide" hx-post="/api/knowledge/build-hat-index"
            hx-target="#hat-index-status"
            hx-swap="innerHTML"
            hx-confirm="This will index all knowledge corpus PDFs for semantic search (10–40 min, runs in background). Continue?"
            style="padding:3px 10px;background:transparent;border:1px solid var(--m-rule);border-radius:var(--m-radius-sm);cursor:pointer;margin-left:12px;"
            onmouseover="this.style.borderColor='var(--m-accent)';this.style.color='var(--m-accent)'"
            onmouseout="this.style.borderColor='var(--m-rule)';this.style.color='var(--m-muted)'">
      INDEX FOR SEMANTIC SEARCH
    </button>
    <span id="hat-index-status" style="font-family:var(--m-mono);font-size:var(--t-micro);margin-left:8px;"></span>
  </h2>

  <div class="panel" style="overflow:hidden;">

    <!-- ── Row 1: Search + Sort ── -->
    <div class="u-rule" style="padding:var(--m-space-4) var(--m-space-5) var(--m-space-3);display:flex;gap:var(--m-space-2);align-items:flex-end;flex-wrap:wrap;">
      <div class="u-grow" style="min-width:220px;">
        <div class="u-label u-label--wide u-mb-1">Search</div>
        <input
          id="hat-q"
          name="q"
          type="search"
          placeholder="Search title, disease, method, note…"
          value="{{ q }}"
          autocomplete="off"
          hx-get="/api/partial/knowledge/hat-corpus-table"
          hx-trigger="keyup changed delay:350ms"
          hx-target="#hat-table-area"
          hx-swap="outerHTML"
          hx-include="#hat-hidden-fields"
          style="width:100%;font-family:var(--m-ui);font-size:var(--t-small);padding:var(--m-space-2) var(--m-space-3);background:var(--m-surface-2);border:1px solid var(--m-rule);border-radius:var(--m-radius);color:var(--m-ink);outline:none;">
      </div>

      <div style="min-width:160px;">
        <div class="u-label u-label--wide u-mb-1">Sort by</div>
        <select id="hat-sort" name="sort"
                style="font-family:var(--m-mono);font-size:var(--t-micro);letter-spacing:0.08em;padding:var(--m-space-2) var(--m-space-3);background:var(--m-surface-2);border:1px solid var(--m-rule);border-radius:var(--m-radius);color:var(--m-ink);outline:none;cursor:pointer;"
                onchange="_refreshHatTable()">
          <option value="title"  {% if active_sort == 'title'  %}selected{% endif %}>Title A–Z</option>
          <option value="folder" {% if active_sort == 'folder' %}selected{% endif %}>Folder</option>
          <option value="added"  {% if active_sort == 'added'  %}selected{% endif %}>Recently added</option>
          <option value="status" {% if active_sort == 'status' %}selected{% endif %}>Status</option>
        </select>
      </div>
    </div>

    <!-- ── Row 2: Collection chips ── -->
    {% if collections %}
    <div class="u-row u-row--wrap u-rule" style="padding:var(--m-space-2) var(--m-space-5);gap:5px;">
      <span class="u-label" style="margin-right:6px;">FOLDER</span>
      <button style="padding:3px 10px;font-family:var(--m-mono);font-size:11px;letter-spacing:0.12em;text-transform:uppercase;border:1px solid var(--m-rule);border-radius:2px;cursor:pointer;white-space:nowrap;background:{% if not active_collection %}var(--m-accent){% else %}var(--m-surface-2){% endif %};color:{% if not active_collection %}var(--m-on-accent){% else %}var(--m-muted){% endif %};"
              data-coll="" onclick="setHatCollection('')">All</button>
      {% for coll, count in collections %}
      <button style="padding:3px 10px;font-family:var(--m-mono);font-size:11px;letter-spacing:0.12em;text-transform:uppercase;border:1px solid var(--m-rule);border-radius:2px;cursor:pointer;white-space:nowrap;background:{% if active_collection == coll %}var(--m-accent){% else %}var(--m-surface-2){% endif %};color:{% if active_collection == coll %}var(--m-on-accent){% else %}var(--m-muted){% endif %};"
              data-coll="{{ coll | e }}" onclick="setHatCollection(this.dataset.coll)">
        {{ coll }}&nbsp;<span style="opacity:.55;">({{ count }})</span>
      </button>
      {% endfor %}
    </div>
    {% endif %}

    <!-- Hidden fields carrying filter state -->
    <div class="u-hide" id="hat-hidden-fields">
      <input type="hidden" id="hat-coll-hidden" name="collection" value="{{ active_collection }}">
      <input type="hidden" id="hat-sort-hidden" name="sort" value="{{ active_sort }}">
    </div>

    <!-- ── Table area ── -->
    {% include "partials/knowledge_hat_corpus_table.html" %}

  </div><!-- /.panel -->
</div><!-- /#hat-corpus-section -->

<script>
function setHatCollection(val) {
  document.getElementById('hat-coll-hidden').value = val;
  document.querySelectorAll('[data-coll]').forEach(function(b) {
    var active = b.dataset.coll === val;
    b.style.background = active ? 'var(--m-accent)' : 'var(--m-surface-2)';
    b.style.color = active ? 'var(--m-on-accent)' : 'var(--m-muted)';
  });
  _refreshHatTable();
}
function _refreshHatTable() {
  var q    = document.getElementById('hat-q').value;
  var sort = document.getElementById('hat-sort').value;
  var coll = document.getElementById('hat-coll-hidden').value;
  document.getElementById('hat-sort-hidden').value = sort;
  htmx.ajax('GET',
    '/api/partial/knowledge/hat-corpus-table?q=' + encodeURIComponent(q) +
    '&sort=' + encodeURIComponent(sort) +
    '&collection=' + encodeURIComponent(coll),
    {target: '#hat-table-area', swap: 'outerHTML'}
  );
}
</script>
