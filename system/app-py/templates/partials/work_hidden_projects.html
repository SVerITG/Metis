<!-- work_hidden_projects.html — chip + inline reveal list for untracked projects -->
<div style="margin-top:var(--m-space-4);padding:var(--m-space-3) var(--m-space-4);background:var(--m-surface-2);border-radius:6px;border:1px solid var(--m-rule-soft);display:flex;align-items:flex-start;gap:var(--m-space-3);flex-wrap:wrap;">
  <span class="u-label u-fixed" style="letter-spacing:.08em;padding-top:2px;">
    {{ hidden | length }} HIDDEN PROJECT{% if hidden | length != 1 %}S{% endif %}
  </span>
  <div class="u-grow" style="display:flex;flex-wrap:wrap;gap:var(--m-space-2);">
    {% for p in hidden %}
    <span style="display:inline-flex;align-items:center;gap:5px;background:var(--m-surface-3);border:1px solid var(--m-rule);border-radius:var(--m-radius);padding:2px 8px 2px 10px;font-size:var(--t-meta);color:var(--m-ink);">
      {{ p.title }}
      <button onclick="retrackProject('{{ p.id }}')"
              title="Show again"
              style="background:none;border:none;cursor:pointer;padding:0 2px;font-size:var(--t-micro);color:var(--m-accent);line-height:1;">+ show</button>
    </span>
    {% endfor %}
  </div>
</div>
