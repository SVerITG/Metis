<div class="grid grid-3 u-mb-6">
  {% for card in cards %}
  <div class="panel panel-pad" style="padding:22px 24px;">
    <div class="u-label u-label--accent u-mb-3" style="letter-spacing:0.2em;">{{ card.label }}</div>
    <div class="u-mb-2" style="font-family:var(--m-display);font-size:var(--t-h3);font-weight:500;color:var(--m-ink);line-height:1.25;">{{ card.title }}</div>
    <div class="ed u-mb-4" style="font-size:var(--t-body);">{{ card.body }}</div>
    <div style="height:2px;background:var(--m-surface-3);border-radius:1px;">
      <div style="height:100%;width:{{ card.pct }}%;background:var(--m-accent);border-radius:1px;"></div>
    </div>
    <div class="u-label" style="margin-top:var(--m-space-2);">{{ card.meta }}</div>
  </div>
  {% endfor %}
</div>
