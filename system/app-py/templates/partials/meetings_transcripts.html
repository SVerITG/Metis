<div class="panel">
  {% if meetings %}
    {% for m in meetings %}
    <div style="display:grid;grid-template-columns:80px 1fr 100px 140px;gap:16px;padding:14px 22px;{% if not loop.last %}border-bottom:1px solid var(--m-rule-soft);{% endif %}align-items:center;">
      <div class="u-label" style="letter-spacing:0.16em;">{{ m.date[:10] if m.date else '—' }}</div>
      <div style="font-family:var(--m-display);font-size:var(--t-body);color:var(--m-ink);">{{ m.title or 'Meeting' }}</div>
      <div class="tnum u-label">{{ m.duration_minutes or '—' }} MIN</div>
      <div style="text-align:right;">
        <span class="u-label" style="display:inline-flex;align-items:center;padding:var(--m-space-1) var(--m-space-2);background:var(--m-surface-2);border-radius:var(--m-radius-sm);">
          {{ (m.status or 'FILED').upper() }}
        </span>
      </div>
    </div>
    {% endfor %}
  {% else %}
  <div class="empty-row">No transcripts yet. Use /meeting-memory to add them.</div>
  {% endif %}
</div>
