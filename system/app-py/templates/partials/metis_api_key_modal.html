{# API key replace/add modal — included once in metis_tab.html #}
<div id="api-key-modal-overlay" class="metis-modal-overlay" data-open="false"
     onclick="if(event.target===this){closeApiKeyModal();}" role="button" tabindex="0">
  <div class="metis-modal" style="max-width:440px;">

    <div class="u-mb-4" style="font-family:var(--m-display);font-size:var(--t-h3);font-weight:500;color:var(--m-ink);">
      <span id="akm-title">API key</span>
    </div>

    <input type="hidden" id="akm-key-name">

    <div class="u-mb-3">
      <label class="u-label" style="letter-spacing:0.16em;text-transform:uppercase;display:block;margin-bottom:var(--m-space-1);">Key name</label>
      <input type="text" id="akm-key-name-display"
             style="width:100%;font-family:var(--m-mono);font-size:var(--t-meta);padding:var(--m-space-2) var(--m-space-3);background:var(--m-surface);border:1px solid var(--m-rule-strong);border-radius:var(--m-radius-sm);color:var(--m-ink);"
             placeholder="e.g. ANTHROPIC_API_KEY" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="e.g. ANTHROPIC_API_KEY">
      <div class="u-label" style="margin-top:var(--m-space-1);">Stored as this name in system/.env</div>
    </div>

    <div class="u-mb-4">
      <label class="u-label" style="letter-spacing:0.16em;text-transform:uppercase;display:block;margin-bottom:var(--m-space-1);">Value</label>
      <input type="password" id="akm-key-value"
             style="width:100%;font-family:var(--m-mono);font-size:var(--t-small);padding:var(--m-space-2) var(--m-space-3);background:var(--m-surface);border:1px solid var(--m-rule-strong);border-radius:var(--m-radius-sm);color:var(--m-ink);"
             placeholder="Paste key here…" autocomplete="new-password" autocorrect="off" spellcheck="false" aria-label="Paste key here">
    </div>

    <div class="metis-note u-mb-4">
      Stored in <code class="u-mono">system/.env</code> on your local machine. Never transmitted anywhere — only read locally by Metis when it needs to make API calls.
    </div>

    <div class="metis-modal-actions">
      <button class="btn btn--ghost btn--caps" onclick="closeApiKeyModal()">Cancel</button>
      <button class="btn btn--primary btn--caps" onclick="saveApiKey()">Save key</button>
    </div>
  </div>
</div>
