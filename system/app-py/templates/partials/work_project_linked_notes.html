<!-- work_project_linked_notes.html -->
{% for n in notes %}
<div class="panel panel-pad u-mb-2" style="padding:var(--m-space-3) var(--m-space-4);position:relative;" data-note-id="{{ n.note_id }}">
  <div class="u-label u-mb-1">{{ n.created_at[:10] }}</div>
  <div style="font-family:var(--m-display);font-size:var(--t-small);color:var(--m-ink);line-height:1.5;white-space:pre-wrap;">{{ n.content }}</div>
  <button onclick="pdDeleteNote('{{ n.note_id }}','{{ project_id }}')"
          style="position:absolute;top:8px;right:8px;background:none;border:none;cursor:pointer;font-size:var(--t-meta);color:var(--m-muted);opacity:.5;padding:2px 4px;"
          onmouseenter="this.style.opacity='1'" onmouseleave="this.style.opacity='.5'">&#10005;</button>
</div>
{% else %}
<div class="u-ed" style="font-size:var(--t-small);">No notes yet.</div>
{% endfor %}
