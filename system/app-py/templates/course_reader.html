<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ course_title }} — Metis</title>
<link rel="icon" type="image/png" href="/static/metis-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!--
  The statistics course's own stylesheet, copied verbatim by
  tools/sync-course-reader-css.sh, plus markdown prose rules written in its
  idiom. the researcher asked for an exact copy of that styling, and this is the literal
  form of that: the same CSS, not an approximation of it.

  The dashboard's /static/styles.css is deliberately NOT loaded here, and that
  is also the scroll fix. It sets `html, body { height: 100% }` and
  `body { overflow: hidden }` because the dashboard is an app shell that scrolls
  an inner pane. The reader inherited that lock, so the page could never scroll
  however the lesson was laid out — which is why the original lesson partial was
  built as an inner scroller in the first place. Dropping the dashboard
  stylesheet removes the lock and delivers the styling in one move.

  app.js is not loaded either: it is the dashboard controller and expects
  dashboard DOM. The two functions the reader actually needs are at the bottom
  of this file.
-->
<link rel="stylesheet" href="/static/course-reader.css?v={{ asset_v }}">
</head>
<body>

<div id="toast-root" class="toast-root"></div>

<header class="topbar">
  <div class="topbar-left">
    <button id="sidebar-toggle" class="icon-btn" type="button" aria-label="Toggle contents" title="Contents">
      <span style="display:block;width:16px;height:2px;background:currentColor;border-radius:2px;"></span>
      <span style="display:block;width:16px;height:2px;background:currentColor;border-radius:2px;"></span>
      <span style="display:block;width:16px;height:2px;background:currentColor;border-radius:2px;"></span>
    </button>
    <div>
      <div class="brand-title">{{ course_title }}</div>
      <div class="brand-sub">Metis · course reader</div>
    </div>
  </div>
  <nav class="topbar-nav" id="reader-tabs">
    {% for t in tabs %}
    <button class="nav-btn{% if loop.first %} active{% endif %}"
            type="button" data-tab="{{ t.id }}">{{ t.label }}</button>
    {% endfor %}
  </nav>
  <div class="topbar-right">
    <a class="reader-back" href="/tab/learning">← Back to Learning</a>
  </div>
</header>

<div class="shell-body">
  <aside id="sidebar" class="sidebar">
    <div class="sidebar-content">
      <div id="course-overview-panel">
        <div class="muted" style="padding:8px 2px;font-size:0.86rem;">Loading…</div>
      </div>
    </div>
  </aside>

  <main id="main" class="main">
    <section class="view active">
      <div class="page-wrap">
        <div id="lesson-reader-panel">
          <div class="card" style="padding:60px 34px;text-align:center;">
            <div class="muted" style="font-size:0.98rem;">Loading…</div>
          </div>
        </div>
      </div>
    </section>
  </main>
</div>

<script src="/static/htmx.min.js"></script>
<script>
/* The reader needs exactly two things from the dashboard's app.js, so they live
   here rather than pulling in the whole controller. */
function showToast(html, duration) {
  var root = document.getElementById('toast-root');
  if (!root) return;
  var t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = html;
  root.appendChild(t);
  setTimeout(function () { t.remove(); }, duration || 4500);
}

async function completeLesson(slug, lessonId, btn) {
  try {
    var res = await fetch('/api/course/' + slug + '/lesson/' + lessonId + '/complete', { method: 'POST' });
    var data = await res.json();
    if (data.status === 'ok') {
      if (btn) btn.textContent = 'Marked complete';
      showToast('Lesson marked complete — ' + data.progress_pct + '% through the course.');
      if (data.next_lesson_id) {
        htmx.ajax('GET', '/api/course/' + slug + '/lesson/' + data.next_lesson_id,
                  { target: '#lesson-reader-panel', swap: 'innerHTML' });
      }
      htmx.ajax('GET', '/api/course/' + slug + '/overview',
                { target: '#course-overview-panel', swap: 'innerHTML' });
    }
  } catch (e) {
    showToast("I couldn't save your lesson progress — try again.");
  }
}

var SLUG = {{ slug | tojson }};
var INITIAL_LESSON = {{ (initial_lesson or '') | tojson }};
var INITIAL_TAB    = {{ (initial_tab or '') | tojson }};

(function () {
  /* Tabs. One click updates two panes — the sidebar contents and the reading
     panel, which opens on that tab's index rather than an empty placeholder.
     Two targets means two requests, so this is scripted rather than done with
     hx-get on the button. */
  function openTab(tab) {
    htmx.ajax('GET', '/api/course/' + SLUG + '/overview?tab=' + tab,
              { target: '#course-overview-panel', swap: 'innerHTML' });
    htmx.ajax('GET', '/api/course/' + SLUG + '/tab/' + tab,
              { target: '#lesson-reader-panel', swap: 'innerHTML' });
    window.scrollTo(0, 0);
  }
  var tabs = document.getElementById('reader-tabs');
  if (tabs) {
    tabs.addEventListener('click', function (e) {
      var b = e.target.closest('.nav-btn');
      if (!b) return;
      tabs.querySelectorAll('.nav-btn').forEach(function (x) { x.classList.remove('active'); });
      b.classList.add('active');
      openTab(b.dataset.tab);
    });
    /* Normally: land on the first tab's index, rather than a placeholder that
       made the reader look empty until you picked something.

       But ?lesson=<id> means someone arrived from Today's "Continue" and wants
       that lesson, not an index. Light its tab, load its sidebar, and open the
       lesson itself. */
    if (INITIAL_LESSON && INITIAL_TAB) {
      var want = tabs.querySelector('.nav-btn[data-tab="' + INITIAL_TAB + '"]');
      if (want) {
        tabs.querySelectorAll('.nav-btn').forEach(function (x) { x.classList.remove('active'); });
        want.classList.add('active');
      }
      htmx.ajax('GET', '/api/course/' + SLUG + '/overview?tab=' + INITIAL_TAB,
                { target: '#course-overview-panel', swap: 'innerHTML' });
      htmx.ajax('GET', '/api/course/' + SLUG + '/lesson/' + INITIAL_LESSON,
                { target: '#lesson-reader-panel', swap: 'innerHTML' });
    } else {
      var first = tabs.querySelector('.nav-btn');
      if (first) openTab(first.dataset.tab);
    }
  }
})();

(function () {
  var btn  = document.getElementById('sidebar-toggle');
  var side = document.getElementById('sidebar');
  var main = document.getElementById('main');

  /* .sidebar.closed / .main.full is the statistics course's own toggle idiom. */
  if (btn && side && main) {
    btn.addEventListener('click', function () {
      side.classList.toggle('closed');
      main.classList.toggle('full');
    });
    /* On a narrow screen the sidebar overlays the text, so picking a lesson
       should put it away — otherwise you tap a lesson and still cannot see it. */
    side.addEventListener('click', function (e) {
      if (window.matchMedia('(max-width: 900px)').matches && e.target.closest('[hx-get]')) {
        side.classList.add('closed');
        main.classList.add('full');
      }
    });
  }

  /* A freshly swapped lesson starts at its title, not wherever the last one
     was scrolled to. */
  document.body.addEventListener('htmx:afterSwap', function (e) {
    if (e.target && e.target.id === 'lesson-reader-panel') window.scrollTo(0, 0);
  });
})();
</script>
</body>
</html>
